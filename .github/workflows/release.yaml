name: Publish

on:
  push:
    paths:
      - ".speakeasy/gen.lock"
      - "gen.yaml"
    branches:
      - main
      - kong-mesh-*
  workflow_dispatch:

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Read terraform.version from gen.yaml and create tag if missing
        id: check_version
        run: |
          set -euo pipefail
          NEW_VER=$(yq -r '.terraform.version' gen.yaml)

          git config --global user.email "apiops@konghq.com"
          git config --global user.name "kong-apiops[bot]"

          # kong-mesh-* branches tag older versions than main, so check this version's tag rather than the highest one
          if git rev-parse -q --verify "refs/tags/v$NEW_VER" >/dev/null; then
            echo "Tag v$NEW_VER already exists. Skipping release."
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip_release=false" >> $GITHUB_OUTPUT

          git tag -a "v$NEW_VER" -m "Release v$NEW_VER"
          git push origin "v$NEW_VER"

          # goreleaser v1 doesn't template make_latest, and editing the tracked config would make the tree dirty
          GORELEASER_CONFIG="$RUNNER_TEMP/goreleaser.yml"
          LATEST_TAG=$(git tag --list --sort=-v:refname | head -n1)
          if [ "$LATEST_TAG" = "v$NEW_VER" ]; then
            cp .goreleaser.yml "$GORELEASER_CONFIG"
          else
            echo "v$NEW_VER is older than $LATEST_TAG, not marking the GitHub release as latest"
            yq '.release.make_latest = "false"' .goreleaser.yml > "$GORELEASER_CONFIG"
          fi
          echo "goreleaser_config=$GORELEASER_CONFIG" >> $GITHUB_OUTPUT
      - name: Import GPG key
        if: ${{ steps.check_version.outputs.skip_release != 'true' }}
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v5.2.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_GPG_PASSPHRASE }}
      - name: Run GoReleaser
        if: ${{ steps.check_version.outputs.skip_release != 'true' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --config ${{ steps.check_version.outputs.goreleaser_config }}
          version: ~> v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
